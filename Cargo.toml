[package]
name = "sigaudit"
version = "0.1.0"
edition = "2021"
description = "Audit commit signatures (OpenPGP and SSH) across git branches"

[[bin]]
name = "sigaudit"
path = "src/main.rs"

[dependencies]
git2 = "0.20"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
chrono = "0.4"
memchr = "2"
rayon = "1.12"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
