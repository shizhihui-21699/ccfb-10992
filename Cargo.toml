[package]
name = "sigaudit"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Offline commit signature auditor for Git repositories (OpenPGP + SSH)"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
gix = { version = "0.90", default-features = false, features = ["sha1", "sha256"] }
pgp = { version = "0.21", default-features = false }
signature = "2.2"
ssh-encoding = "0.2"
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "ecdsa", "dsa", "p256", "p384", "p521"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rand = "0.8"
rand_chacha = "0.3"

[profile.release]
lto = true
