[package]
name = "git-sig-audit"
version = "0.1.0"
edition = "2021"
description = "Audit GPG/SSH commit signatures across all branches of a git repository"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
git2 = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
opt-level = 2
